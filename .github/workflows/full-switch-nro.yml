name: Full PES 2017 Nintendo Switch NRO

on:
  workflow_dispatch:
  push:
    branches:
      - work/switch-libnx-platform
    paths:
      - "pes/**"
      - "ppc/**"
      - "runtime/**"
      - "switch/mesa/**"
      - "third_party/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build-switch.sh"
      - ".github/workflows/full-switch-nro.yml"

permissions:
  contents: read

concurrency:
  group: full-switch-nro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build full game with devkitA64 and BO2 Mesa NVK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out private project and generated PPC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate private game and generated PPC inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s pes/default.xex
          test -s ppc/XEX_TARGET
          test -s ppc/ppc_func_mapping.cpp
          test -s ppc/stubs_generated.cpp
          count="$(find ppc -maxdepth 1 -type f -name 'ppc_recomp.*.cpp' | wc -l)"
          test "$count" -gt 0
          echo "Generated PPC translation units: $count"
          echo "Checking expected XEX identity..."
          echo "b914ec9a1abb3a9b42a64255b6aa8ff27312da126f7c18f8c880106b832779e6  pes/default.xex" | sha256sum --check
          grep -E '^title_id=0x4A3007D1$' ppc/XEX_TARGET
          grep -E '^version=0x00000012$' ppc/XEX_TARGET
          grep -E '^sha256=b914ec9a1abb3a9b42a64255b6aa8ff27312da126f7c18f8c880106b832779e6$' ppc/XEX_TARGET

      - name: Download and verify pinned BO2 Mesa Horizon Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/AlvaroEPena/bo2-360-nx/releases/download/Release-1.1.0/bo2-360-nx-release-1.1.0-switch%2Bwindows-build-kit.zip"
          archive="$RUNNER_TEMP/bo2-switch-build-kit.zip"
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo "5c973a38b0921650ebfddf47fd9064f46f5aefa60d019a84371cfb0af328a26f  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bo2-kit"
          unzip -q "$archive" -d "$RUNNER_TEMP/bo2-kit"
          manifest_path="$(find "$RUNNER_TEMP/bo2-kit" -type f -path '*/runtime/manifest.json' -print -quit)"
          test -n "$manifest_path"
          runtime_dir="$(dirname "$manifest_path")"
          python3 - "$manifest_path" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              manifest = json.load(f)
          assert manifest["commit"] == "897abae89ca1836abe119581883b435d80edc6fe", manifest.get("commit")
          assert manifest["mesa"]["base"] == "danfromtico/mesa-switch 1a8c1a66d6f", manifest.get("mesa")
          print("Verified BO2 Horizon runtime:", manifest["commit"])
          print("Verified Mesa base:", manifest["mesa"]["base"])
          PY
          sdk="$runtime_dir/switch/portlibs"
          test -s "$sdk/lib/libvulkan.a"
          test -s "$sdk/lib/libzstd.a"
          test -s "$sdk/include/vulkan/vulkan.h"
          echo "BO2_MESA_SDK=$sdk" >> "$GITHUB_ENV"
          echo "Pinned BO2 Mesa Horizon SDK contains libvulkan.a and Vulkan headers."

      - name: Build full PES runtime and package NRO
        shell: bash
        run: |
          set -euo pipefail
          docker pull devkitpro/devkita64:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$BO2_MESA_SDK:/mesa-sdk:ro" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -euc '
              export DEVKITPRO=/opt/devkitpro
              export DEVKITA64="$DEVKITPRO/devkitA64"
              export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
              export PES17_SWITCH_VULKAN_SDK=/mesa-sdk
              export JOBS=2
              test -x "$DEVKITA64/bin/aarch64-none-elf-g++"
              test -x "$DEVKITPRO/tools/bin/nacptool"
              test -x "$DEVKITPRO/tools/bin/elf2nro"
              test -s /mesa-sdk/lib/libvulkan.a
              test -s /mesa-sdk/lib/libzstd.a
              bash -n ./build-switch.sh
              ./build-switch.sh
              test -s build-switch/pes17.nro
              file build-switch/pes17.nro
              sha256sum build-switch/pes17.nro
              ls -lh build-switch/pes17.nro
            '

      - name: Upload full game NRO
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-switch-full-nro
          path: build-switch/pes17.nro
          if-no-files-found: error
          retention-days: 7
